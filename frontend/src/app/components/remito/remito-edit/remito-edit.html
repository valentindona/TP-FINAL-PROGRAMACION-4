<section class="editor-panel">
    <header class="editor-head">
        <div>
            <p class="eyebrow">Remito · Edición</p>
            <h2>Editar remito</h2>
        </div>
    </header>

    <form [formGroup]="formulario" class="form-grid">

        <div class="field-block">
            <label for="edit-fecha">Fecha</label>
            <input id="edit-fecha" type="date" formControlName="fecha">
        </div>

        <div class="field-block">
            <label for="edit-institucion">Institución</label>
            <select id="edit-institucion" formControlName="idInstitucion">
                <option [ngValue]="0" disabled>Seleccione una institución...</option>
                @for (institucion of instituciones; track institucion.id) {
                    <option [ngValue]="idValue(institucion.id)">{{ institucion.nombre }}</option>
                }
            </select>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-back" (click)="cancel()">Cancelar</button>
            <button type="button" (click)="save()" [disabled]="formulario.invalid">
                Guardar cambios
            </button>
        </div>

    </form>

</section>
