<section class="editor-panel">
    <header class="editor-head">
        <div>
            <p class="eyebrow">Catálogo · Edición</p>
            <h2>Editar producto</h2>
        </div>
    </header>

    <form [formGroup]="formulario" class="form-grid" (ngSubmit)="save()">
        <div class="field-block">
            <label for="edit-nombre">Nombre</label>
            <input id="edit-nombre" type="text" formControlName="nombre">
        </div>

        <div class="field-block">
            <label for="edit-categoria">Categoria</label>
            <select id="edit-categoria" formControlName="categoria">
                <option value="" disabled>Seleccione una categoria...</option>

                @for (item of categorias; track $index) {
                    <option [value]="item"> {{ item.replaceAll("_", ' ') }}</option>
                }
            </select>
        </div>

        <div class="field-block">
            <label for="edit-unidad">Unidad de Medida</label>

            <select id="edit-unidad" formControlName="unidadMedida">
                <option value="" disabled>Seleccione una unidad de medida</option>

                @for (item of unidades; track $index) {
                    <option [value]="item"> {{ item.replaceAll('_', ' ') }}</option>
                }
            </select>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-back" (click)="cancel()">Cancelar</button>
            <button type="submit" [disabled]="formulario.invalid">Guardar cambios</button>
        </div>
    </form>
</section>
