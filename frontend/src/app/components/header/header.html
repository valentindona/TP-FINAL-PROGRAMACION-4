<div class="site-header">
    <a class="brand" routerLink="/" aria-label="Ir al inicio · Banco de Alimentos · Gestor Global Solidario">
        <span class="brand-logo">
            <img src="logo-banco.png" alt="Banco de Alimentos" width="121" height="34">
        </span>
        <span class="brand-app">Gestor Global Solidario</span>
    </a>
    @if (auth.isLoggedIn()) {
        <div class="session">
            <a class="session-link" routerLink="/home">Panel</a>
            <span class="session-user">
                <span class="avatar" aria-hidden="true">{{ auth.username()?.charAt(0) }}</span>
                <span class="session-meta">
                    <span class="session-label">Sesión activa</span>
                    <strong>{{ auth.username() }}</strong>
                </span>
            </span>
            <button type="button" (click)="auth.logout()">Cerrar sesión</button>
        </div>
    }
</div>
