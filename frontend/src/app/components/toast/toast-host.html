<div class="toast-viewport" aria-live="polite" aria-atomic="false">
    @for (toast of notifications.toasts(); track toast.id) {
        <article
            class="toast"
            [class]="'toast toast--' + toast.tone"
            [class.is-leaving]="toast.leaving"
            [attr.role]="toast.tone === 'error' ? 'alert' : 'status'"
        >
            <span class="toast-mark" aria-hidden="true">
                @switch (toast.tone) {
                    @case ('success') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4.5 12.5l5 5 10-11" />
                        </svg>
                    }
                    @case ('error') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3.2 22 20.4H2L12 3.2Z" />
                            <path d="M12 9.6v4.6" />
                            <path d="M12 17.4h.01" />
                        </svg>
                    }
                    @default {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9.2" />
                            <path d="M12 11v5.4" />
                            <path d="M12 7.8h.01" />
                        </svg>
                    }
                }
            </span>

            <p class="toast-msg">{{ toast.message }}</p>

            <button
                class="toast-close"
                type="button"
                [attr.aria-label]="'Cerrar mensaje: ' + toast.message"
                (click)="notifications.dismiss(toast.id)"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
                </svg>
            </button>

            <span class="toast-progress" [style.animation-duration]="duration(toast.tone)" aria-hidden="true"></span>
        </article>
    }
</div>
